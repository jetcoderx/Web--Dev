<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS cards</title>
    <style>
        body {
            background-color: gray;
            padding: 30px;


        }

        .card {
            background-color: white;
            width: 200px;
            height: 400px;
            border-radius: 8px;
            margin: 4px;
        }

        img {
            padding: 5px;
            border-radius: 8px;
        }

        .capsule {
            padding: 2px 15px;
        }

        span {
            border: 0.5px solid gray;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 13px;
            font-family: "Poppins", sans-serif;
            font-weight: lighter;
            background-color: rgba(250, 249, 249, 0.984);
            color: gray;
    
        }

        .content {
            padding: 7px 13px;
        }

        .content h2 {
            font-size: 20px;
            font-family: "Poppins", sans-serif;
            font-weight: 300;
        }

        p {
            font-size: 12px;
            padding: 5px;
            color: gray;
            font-family: "Poppins", sans-serif;
            font-weight: 300;
        }

        .button {
            text-align: center;

        }

        .button button {
            border: none;
            background-color: rgba(150, 209, 243, 0.479);
            color: rgba(92, 92, 238, 0.849);
            border-radius: 10px;
            padding: 5px 20px;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .button button:hover {
            background-color: rgb(194, 225, 246);
            color: rgb(10, 136, 214);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="image">
            <img width="190" height="150"
                src=""
                alt="Naav ki image">

        </div>
        <div class="capsule">
            <span>Nature</span>
            <span>Lake</span>
        </div>


        <div class="content">
            <h2>Harsh Maurya</h2>
            <p>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit. Qui dolorum necessitatibus laborum? Odit sint
                numquam dolorem amet quaerat expedita libero id, quasi ad?
            </p>
        </div>
        <div class="button">
            <button>Read more</button>
        </div>



    </div>
</body>

</html>
