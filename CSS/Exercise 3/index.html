<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS website</title>
    <style>
        :root{
            --primarycolor:rgba(4, 143, 235, 0.888);
            --textcolor:rgb(242, 244, 245);
            --secondarycolor:rgba(148, 210, 251, 0.888);
        }
        body{
            background-color: var(--secondarycolor);
        }
        *{
            margin: 0;
            padding: 0;
        }
        ul li{
            list-style: none;
            display: inline;
            padding: 25px;
            color: var(--textcolor);
            font-weight: bolder;
            
        }
        a{
            text-decoration: none;
            

        }
        nav
        {
            padding: 20px 0px;
            background-color: var(--primarycolor);
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <a href="/"><li>Home</li></a>
                <a href="/"><li>Services</li></a>
                <a href="/"><li>About</li></a>
                <a href="/"><li>Contact us</li></a>
            </ul>
        </nav>
    </header>
    
</body>
</html>
